<!doctype html><html lang="ar" dir="rtl" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>كتالوج الأدوات الصحية – قوى الإمتياز | فرع البيان</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
:root{--navy:#003160;--deep:#00264b;--gold:#ffb000;--gold2:#e69f00;--bg:#e6ebf2;--card:#fff;--bar:#fff;--fg:#0a2540;--muted:#4d6179;--line:#d9e0ea;--tint:#f4f6f9;--brick:rgba(255,255,255,.07);--font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07182d;--card:#0d2442;--bar:#0d2442;--fg:#eef3f9;--muted:#a9b8cb;--line:#1d3556;--tint:#12305a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#07182d;--card:#0d2442;--bar:#0d2442;--fg:#eef3f9;--muted:#a9b8cb;--line:#1d3556;--tint:#12305a;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);font:15px/1.6 var(--font);color:var(--fg);-webkit-print-color-adjust:exact;print-color-adjust:exact}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:30}
button{font:600 .88rem var(--font);cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--fg);padding:7px 13px;border-radius:10px}
.go{background:var(--gold);color:var(--deep);border-color:var(--gold);box-shadow:0 3px 0 var(--gold2)}
.tbr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 12px;align-items:center}
.tbr img{height:32px}.tbr .sp{flex:1}.tbr .on{background:var(--navy);color:#fff;border-color:var(--navy)}
select,input,textarea{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.adb{background:var(--card);border-bottom:2px dashed var(--gold);display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 12px}.adb input[type=text]{width:150px}
.sh{padding:18px 0 40px;display:flex;flex-direction:column;align-items:center;gap:18px;zoom:var(--z,1)}
.sheet{width:210mm;height:297mm;background:#fff;color:#0a2540;display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:0 6px 28px rgba(0,20,50,.25);--pic:66mm}
.pat{background-color:var(--navy);background-image:linear-gradient(var(--brick) 1px,transparent 1px),linear-gradient(90deg,var(--brick) 1px,transparent 1px);background-size:48px 24px,96px 48px;color:#fff}
.tick{background:var(--gold);color:var(--deep);font-weight:700;font-size:13px;text-align:center;padding:5px 14px;flex:none}
.band{padding:12px 14mm;display:flex;align-items:center;gap:16px;border-bottom:6px solid var(--gold);flex:none}
.plate{background:#fff;border-radius:12px;padding:6px 12px;display:inline-block}.plate img{display:block;height:42px}
.band .t{flex:1}.band .t b{display:block;font-size:19px;line-height:1.3}.band .t span{opacity:.8;font-size:12px}
.pg{flex:1;padding:12px 12mm 8px;display:flex;flex-direction:column;gap:10px;min-height:0}
.rib{align-self:flex-start;background:var(--navy);color:#fff;font-size:22px;font-weight:700;padding:4px 34px 4px 44px;border-inline-start:9px solid var(--gold);margin-inline-start:-12mm;border-radius:0 14px 14px 0;flex:none}
.ban{height:30mm;border-radius:16px;overflow:hidden;position:relative;flex:none;color:#fff}.ban img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ban .tx{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 22px;background:linear-gradient(270deg,rgba(0,38,75,.9),rgba(0,38,75,.1) 80%)}.ban b{font-size:23px;color:var(--gold);line-height:1.3}.ban span{font-size:13.5px}
.g4{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px 14px;min-height:0}
.pc{display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;min-height:0;overflow:hidden;border:1.5px solid #d9e0ea;border-radius:18px;padding:10px 12px;gap:3px}
.pic{width:var(--pic);height:var(--pic);border-radius:18px;background:#fff;border:3px solid #e3e9f1;position:relative;overflow:hidden;flex:none}.pic img{width:100%;height:100%;object-fit:contain;padding:5%}
.tags{display:flex;flex-direction:column;gap:3px;position:absolute;top:7px;inset-inline-end:7px;align-items:flex-end}
.pill{display:inline-block;color:#fff;font-size:11px;font-weight:700;padding:1px 9px;border-radius:99px;white-space:nowrap;line-height:1.5}
.pc h3{margin:4px 0 0;font-size:15.5px;line-height:1.4;color:var(--navy)}.br{font-size:12px;color:#4d6179}.ds{margin:0;font-size:12px;line-height:1.5;color:#33465c;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ft2{list-style:none;margin:2px 0 0;padding:0;font-size:11.5px;text-align:start;align-self:stretch;display:flex;flex-direction:column;gap:1px}.ft2 li::before,ul.f li::before{content:"✓";display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--gold);color:var(--deep);font-size:9px;font-weight:700;margin-inline-end:6px}
.price{background:var(--gold);color:var(--deep);font-weight:700;border-radius:8px;padding:0 12px;font-size:13px}
.ft{background:var(--navy);color:#fff;border-top:6px solid var(--gold);padding:9px 14mm;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;flex:none}.ltr{direction:ltr;unicode-bidi:plaintext}.ft .ph{font-weight:700;color:var(--gold);font-size:14px}
.ui-b{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:auto}.ui-b button{padding:2px 8px;font-size:11px}.d{color:#c0392b}
.cov{justify-content:center;align-items:center;text-align:center;padding:20mm 16mm;gap:6px;flex:1;display:flex;flex-direction:column}.cov .plate{padding:16px 30px;border-radius:22px;box-shadow:0 12px 30px rgba(0,0,0,.3)}.cov .plate img{height:96px}
.kind{background:var(--gold);color:var(--deep);font-weight:700;font-size:14px;padding:3px 18px;border-radius:99px;margin-top:22px}.cov h1{margin:10px 0 4px;font-size:50px;line-height:1.25}.cov p{margin:0;font-size:20px;opacity:.9}
.cov .cl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:26px}.cov .cl span{border:1.5px solid rgba(255,255,255,.5);border-radius:99px;padding:3px 18px;font-size:15px}
.end{flex:1;padding:16mm 14mm 10mm;display:flex;flex-direction:column;gap:12px}.end h2{margin:0;font-size:34px;color:var(--gold)}.end .msg{font-size:17px;margin:0 0 6px;max-width:56ch}
.bx{display:grid;grid-template-columns:1fr 1fr;gap:12px}.bk{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:12px 16px}.bk h4{margin:0 0 6px;color:var(--gold);font-size:17px;border-bottom:2px solid var(--gold);display:inline-block}
.row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:14px}.row>span:first-child{opacity:.8}.col{flex-direction:column}
.lk{display:inline-block;margin-top:6px;background:var(--gold);color:var(--deep);text-decoration:none;font-weight:700;border-radius:10px;padding:5px 14px;font-size:13px}.cp{color:#fff;border-color:rgba(255,255,255,.4);padding:1px 8px;font-size:11px}
[data-ph]:empty::before{content:attr(data-ph);opacity:.45}[contenteditable]{outline:1px dashed rgba(255,176,0,.7);outline-offset:3px;border-radius:4px}[contenteditable]:focus{outline:2px solid var(--gold)}
.pp .main{flex:1;padding:16px 14mm 10px;display:flex;flex-direction:column;gap:12px;min-height:0}.pp .kind{align-self:flex-start;margin:0}.pp h1{margin:0;font-size:36px;line-height:1.25;color:var(--navy)}.pp .lead{margin:0;font-size:15px;color:#4d6179}
.slot{position:relative;border:3px solid var(--gold);border-radius:20px;background:var(--tint);display:grid;place-items:center;overflow:hidden;cursor:pointer;color:#4d6179;font-weight:600;height:340px;flex:none}.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:var(--navy);color:#fff;border-radius:12px;padding:8px;text-align:center}.stat b{display:block;font-size:20px;color:var(--gold);line-height:1.4;min-height:28px}.stat span{font-size:12px;opacity:.9}
.cols{display:grid;grid-template-columns:1fr 1.15fr;gap:18px;flex:1;min-height:0}.pp h2{margin:0 0 8px;font-size:17px;color:var(--navy);border-bottom:3px solid var(--gold);display:inline-block}
ul.f{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}ul.f li{position:relative}ul.f li::before{width:19px;height:19px;font-size:11px}
table{width:100%;border-collapse:collapse;font-size:13.5px}td{padding:5px 10px;border:1px solid #d9e0ea;position:relative}td:first-child{background:var(--navy);color:#fff;font-weight:600;width:38%}
.add{margin-top:6px;border:1px dashed var(--navy);color:var(--navy);padding:3px 10px;font-size:12px}.x{position:absolute;top:6px;inset-inline-end:6px;z-index:3;border:0;background:#c0392b;color:#fff;width:24px;height:24px;border-radius:50%;padding:0;line-height:1}
dialog{border:0;border-radius:20px;padding:0;width:min(640px,94vw);max-height:92vh;background:var(--card);color:var(--fg);box-shadow:0 20px 60px rgba(0,0,0,.4)}dialog::backdrop{background:rgba(0,20,45,.6)}
.dh{background:var(--navy);color:#fff;border-bottom:5px solid var(--gold);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;font-weight:700}.dh button{color:#fff;border-color:rgba(255,255,255,.4);padding:2px 10px}
.db{padding:16px 18px;display:flex;flex-direction:column;gap:12px}.big{aspect-ratio:2.2;background:#fff;border:3px solid var(--gold);border-radius:18px;overflow:hidden}.big img{width:100%;height:100%;object-fit:contain}
label{font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:3px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tgl{display:flex;gap:6px;flex-wrap:wrap}.tgl .pill,#tm .pill{opacity:.35;cursor:pointer;padding:3px 12px;font-size:12px}.pill.on{opacity:1!important}
#tm{position:fixed;z-index:50;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 12px 30px rgba(0,0,0,.3);display:none;flex-direction:column;gap:6px;text-align:center}
.pk{display:flex;align-items:center;gap:10px;flex-direction:row;font-weight:500}.pk img{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line)}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--deep);color:#fff;padding:8px 18px;border-radius:99px;z-index:60;display:none;border:1px solid var(--gold)}
@media print{@page{size:A4;margin:0}html,body{background:#fff}body::before,.tbr,.adb,.ui,.ui-b,.x,.add,#tm,#toast{display:none!important}.sh{padding:0;gap:0;zoom:1!important;display:block}.sheet{box-shadow:none;break-after:page;page-break-after:always}[contenteditable],.slot{outline:0}.slot{border-style:solid}.slot .ph0,[data-ph]:empty::before{display:none}ul.f li:empty,tr.e{display:none}}
</style></head><body>

<script>

  ch.forEach((g,i)=>o.push(`<section class="sheet" style="${i==0&&sb?'--pic:54mm':''}">${tick()}${band()}<div class="pg"><span class="rib">${esc(c)}${i?' (تابع)':''}</span>${admin&&!i?`<div class="ui"><button data-a="ban" data-v="${esc(c)}">إعلان القسم ▣</button> ${ps.length?'':`<button class="d" data-a="delcat" data-v="${esc(c)}">حذف القسم</button>`}</div>`:''}${i==0&&sb?`<div class="ban pat">${b.img?`<img src="${b.img}" alt="">`:''}<div class="tx"><b>${esc(b.h)}</b><span>${esc(b.s)}</span></div></div>`:''}<div class="g4">${g.map(card).join('')||'<div style="grid-column:1/-1;text-align:center;color:#4d6179;padding:30px">لا توجد أصناف في هذا القسم بعد.</div>'}</div></div>${foot()}</section>`))});

 o.push(`<section class="sheet pat">${tick()}<div class="end"><div class="plate" style="align-self:flex-start"><img src="${S.logo}" alt=""></div><h2>شريكنا في النجاح… أنت</h2><p class="msg" ${ce('contact.msg')}>${esc(c.msg)}</p><div class="bx"><div class="bk"><h4>موقع الفرع</h4><div class="row"><span ${ce('contact.loc','العنوان')}>${esc(c.loc)}</span></div>${admin?`<div class="row"><span>رابط الخريطة</span><span class="ltr" ${ce('contact.map','https://maps.app.goo.gl/…')}>${esc(c.map)}</span></div>`:''}${c.map?`<a class="lk" href="${esc(c.map)}" target="_blank" rel="noopener">افتح على الخريطة</a>`:''}</div><div class="bk"><h4>أرقام الفرع</h4>${c.phones.map((x,i)=>admin||x.v?`<div class="row"><span ${ce(`contact.phones.${i}.l`,'الاسم')}>${esc(x.l)}</span><span class="ltr" ${ce(`contact.phones.${i}.v`,'05xxxxxxxx')}>${esc(x.v)}</span></div>`:'').join('')}</div><div class="bk"><h4>حساباتنا</h4>${c.social.map((x,i)=>admin||x.v?`<div class="row"><span ${ce(`contact.social.${i}.l`,'المنصة')}>${esc(x.l)}</span><span class="ltr" ${ce(`contact.social.${i}.v`,'الحساب')}>${esc(x.v)}</span></div>`:'').join('')}</div><div class="bk"><h4>الحسابات البنكية</h4>${c.banks.map((x,i)=>admin||x.i?`<div class="row col"><b ${ce(`contact.banks.${i}.b`,'اسم البنك')}>${esc(x.b)}</b><span ${ce(`contact.banks.${i}.n`,'اسم صاحب الحساب')}>${esc(x.n)}</span><span class="ltr" ${ce(`contact.banks.${i}.i`,'SA…')}>${esc(x.i)}</span>${x.i?`<button class="cp ui" data-a="cp" data-v="${esc(x.i)}">نسخ الآيبان</button>`:''}</div>`:'').join('')}</div></div><div style="margin-top:auto;text-align:center;font-size:13px;opacity:.75">قوى الإمتياز لتجارة مواد البناء – فرع حي البيان</div></div></section>`);
 return o.map((h,i)=>h.replace('%n%',`${i+1} / ${o.length}`)).join('')}
function render(){
 $('#top').innerHTML=`<div class="tbr"><img src="${S.logo}" alt=""><button data-a="v" data-v="cat" class="${view=='cat'?'on':''}">الكتالوج</button><button data-a="v" data-v="sheets" class="${view=='sheets'?'on':''}">عرض منتج أو أكثر</button>${view=='cat'?`<select data-a="sc" title="نطاق الكتالوج"><option value="الكل">كتالوج كامل (كل الأقسام)</option>${S.cats.map(c=>`<option ${c==scope?'selected':''}>${esc(c)}</option>`).join('')}</select>`:`<button data-a="ns">+ صفحة فارغة</button><button data-a="pk">+ من الكتالوج</button>`}<span class="sp"></span><button class="go" data-a="pr">طباعة / حفظ PDF</button>${can?`<button data-a="adm" class="${admin?'on':''}">${admin?'إنهاء الإدارة':'وضع الإدارة'}</button>`:''}</div>`;
 $('#adm').innerHTML=admin&&view=='cat'?`<div class="adb"><button class="go" data-a="new">+ منتج</button><label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" data-a="prc" ${S.prices?'checked':''}> الأسعار</label><input type="text" id="nc" placeholder="قسم جديد"><button data-a="addcat">+ قسم</button><label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" data-a="tk" ${S.ticker.on?'checked':''}> شريط عاجل</label><input type="text" id="tt" placeholder="نص الشريط العاجل" value="${esc(S.ticker.text)}" style="min-width:200px"><button class="go" data-a="pub" id="pubb">${art?'نشر التعديلات':'حفظ نسخة محدثة'}${changed?' ●':''}</button></div>`:'';
 $('#cat').style.display=view=='cat'?'':'none';$('#sheets').style.display=view=='sheets'?'':'none';
 if(view=='cat')$('#cat').innerHTML=pages();else if(!$('#sheets').children.length)addSheet()}
const rm=()=>{changed=true;const b=$('#pubb');if(b&&!b.textContent.includes('●'))b.textContent+=' ●'};
const li=(v,ph)=>`<li contenteditable data-ph="${ph||'ميزة'}">${esc(v||'')}</li>`,tr=(k,v)=>`<tr class="${k||v?'':'e'}"><td contenteditable data-ph="البند">${esc(k||'')}</td><td contenteditable data-ph="القيمة">${esc(v||'')}</td></tr>`;
function sheet(d){d=d||{};const st=[...(d.stats||[]),['','الشركة المصنعة'],['','المنشأ'],['','اللون'],['','الخامة']].slice(0,4),fe=d.feat||[],sp=d.spec||[];
 return `<section class="sheet pp"><button class="x ui" data-a="xs" title="حذف الصفحة">×</button>${band()}<div class="main"><span class="kind" contenteditable data-ph="القسم">${esc(d.kind||'')}</span><h1 contenteditable data-ph="اسم المنتج">${esc(d.title||'')}</h1><p class="lead" contenteditable data-ph="وصف المنتج في سطر أو سطرين">${esc(d.lead||'')}</p><div class="slot" data-a="sl">${d.img?`<img src="${d.img}" alt="">`:'<span class="ph0">اضغط لإضافة صورة المنتج</span>'}</div><div class="stats">${st.map(s=>`<div class="stat"><b contenteditable data-ph="—">${esc(s[0])}</b><span contenteditable>${esc(s[1])}</span></div>`).join('')}</div><div class="cols"><div><h2>المميزات</h2><ul class="f">${[...fe,'',''].slice(0,Math.max(3,fe.length)).map(x=>li(x)).join('')}</ul><button class="add ui" data-a="af">+ ميزة</button></div><div><h2>المواصفات</h2><table><tbody>${(sp.length?sp:[['المنتج',''],['الشركة المصنعة',''],['المقاس',''],['الضمان','']]).map(r=>tr(r[0],r[1])).join('')}</tbody></table><button class="add ui" data-a="ar">+ بند</button></div></div></div><footer class="ft"><span contenteditable>مسؤول المبيعات: مازن البشيري</span><span class="ltr ph" contenteditable>${esc((S.contact.phones.find(p=>p.v)||{}).v||'')}</span><span>quwaimtiaz.com</span></footer></section>`}
const addSheet=d=>$('#sheets').insertAdjacentHTML('beforeend',sheet(d));
const toSheet=p=>({kind:p.cat,title:p.name,lead:p.desc,img:p.img,stats:[[p.brand,'الشركة المصنعة'],...p.spec.filter(r=>!['المنتج','العلامة التجارية'].includes(r[0])).slice(0,3).map(r=>[r[1],r[0]])],feat:p.feat,spec:p.spec});
function dlg(h){const d=$('#dlg');d.innerHTML=h;d.showModal();return d}
const tagBox=l=>TG.map(t=>`<span class="pill ${l.includes(t[0])?'on':''}" data-t="${t[0]}" style="background:${t[1]};color:${t[2]||'#fff'}">${t[0]}</span>`).join('');
function editP(p){const n=!p;p=p||{id:Date.now(),name:'',cat:S.cats[0]||'',brand:'',desc:'',feat:[],spec:[],price:'',tags:['متوفر'],img:''};
 const d=dlg(`<div class="dh"><span>${n?'إضافة منتج':'تعديل المنتج'}</span><button data-a="x">✕</button></div><div class="db"><div class="big"><img id="pv" src="${p.img}" alt=""></div><input type="file" id="fi" accept="image/*"><label>اسم المنتج<input id="f-name" value="${esc(p.name)}"></label><div class="two"><label>القسم<select id="f-cat">${S.cats.map(c=>`<option ${c==p.cat?'selected':''}>${esc(c)}</option>`).join('')}</select></label><label>الشركة المصنعة / العلامة<input id="f-brand" value="${esc(p.brand)}"></label></div><label>السعر (ر.س – اختياري)<input id="f-price" inputmode="decimal" value="${esc(p.price)}"></label><label>وصف قصير<textarea id="f-desc" rows="2">${esc(p.desc)}</textarea></label><label>المميزات (كل سطر ميزة)<textarea id="f-feat" rows="3">${esc(p.feat.join('\n'))}</textarea></label><label>المواصفات (كل سطر: الاسم: القيمة)<textarea id="f-spec" rows="4">${esc(p.spec.map(r=>r.join(': ')).join('\n'))}</textarea></label><div><b style="font-size:13px">الوسوم</b><div class="tgl" id="f-tags">${tagBox(p.tags)}</div></div><button class="go" data-a="save">حفظ</button></div>`);d._p=p;d._n=n}
function banP(c){const b=S.banners[c]=S.banners[c]||{on:false,img:'',h:'',s:''};const d=dlg(`<div class="dh"><span>إعلان قسم: ${esc(c)}</span><button data-a="x">✕</button></div><div class="db"><div class="big"><img id="pv" src="${b.img}" alt=""></div><input type="file" id="fi" accept="image/*"><label>العنوان الدعائي<input id="b-h" value="${esc(b.h)}"></label><label>سطر دعائي<input id="b-s" value="${esc(b.s)}"></label><label style="flex-direction:row;gap:8px;align-items:center"><input type="checkbox" id="b-on" ${b.on?'checked':''}> إظهار الإعلان أعلى القسم</label><button class="go" data-a="saveb">حفظ</button></div>`);d._c=c}
const shrink=(f,m=560)=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.8))};i.src=URL.createObjectURL(f)});
async function pub(){toast('جارٍ الحفظ…');const c=document.documentElement.cloneNode(true);c.removeAttribute('style');c.querySelector('#data').textContent=JSON.stringify(S).replace(/</g,'\\u003c');c.querySelector('#app').innerHTML='<div id="top"></div><div id="adm"></div><div id="cat" class="sh"></div><div id="sheets" class="sh" style="display:none"></div>';['#dlg','#tm','#toast'].forEach(s=>{const e=c.querySelector(s);e.innerHTML='';e.removeAttribute('style');e.removeAttribute('open')});const h='<!doctype html>'+c.outerHTML;if(art){try{await art.publish(h)}catch(e){toast('تعذّر النشر')}}else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download='كتالوج-فرع-البيان.html';a.click();changed=false;render();toast('تم حفظ نسخة محدثة')}}
const ch=()=>{changed=true;render()};
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-t]');if(t){t.classList.toggle('on');const m=$('#tm');if(t.closest('#tm')){m._p.tags=[...m.querySelectorAll('.on')].map(x=>x.dataset.t);ch()}return}
 if(!e.target.closest('#tm'))$('#tm').style.display='none';
 const a=e.target.closest('[data-a]');if(!a||a.tagName=='SELECT')return;const k=a.dataset.a,id=a.closest('.pc')?.dataset.id,p=S.products.find(x=>x.id==id);
 if(k=='x')$('#dlg').close();else if(k=='pr')window.print();else if(k=='v'){view=a.dataset.v;render()}else if(k=='adm'){admin=!admin;render()}
 else if(k=='new')editP();else if(k=='edit')editP(p);
 else if(k=='save'){const d=$('#dlg'),q=d._p,v=i=>$('#f-'+i).value.trim();if(!v('name'))return toast('اكتب اسم المنتج');Object.assign(q,{name:v('name'),cat:v('cat'),brand:v('brand'),price:v('price'),desc:v('desc'),feat:v('feat').split('\n').map(x=>x.trim()).filter(Boolean),spec:v('spec').split('\n').map(x=>x.split(':').map(y=>y.trim())).filter(r=>r[0]).map(r=>[r[0],r.slice(1).join(':').trim()]),tags:[...document.querySelectorAll('#f-tags .on')].map(x=>x.dataset.t),img:$('#pv').getAttribute('src')||''});if(d._n)S.products.push(q);d.close();ch()}
 else if(k=='saveb'){const d=$('#dlg'),b=S.banners[d._c];Object.assign(b,{h:$('#b-h').value.trim(),s:$('#b-s').value.trim(),on:$('#b-on').checked,img:$('#pv').getAttribute('src')||''});d.close();ch()}
 else if(k=='ban')banP(a.dataset.v);
 else if(k=='tag'){e.stopPropagation();const m=$('#tm'),r=a.getBoundingClientRect();m.innerHTML=tagBox(p.tags);m._p=p;m.style.display='flex';m.style.top=Math.min(r.bottom+4,innerHeight-260)+'px';m.style.left=Math.max(8,Math.min(r.left,innerWidth-170))+'px'}
 else if(k=='mv'){const i=S.products.indexOf(p),j=i+ +a.dataset.d;if(S.products[j]){[S.products[i],S.products[j]]=[S.products[j],S.products[i]];ch()}}
 else if(k=='del'){if(a.dataset.c){S.products=S.products.filter(x=>x!=p);ch()}else{a.dataset.c=1;a.textContent='تأكيد؟'}}
 else if(k=='addcat'){const v=$('#nc').value.trim();if(v&&!S.cats.includes(v)){S.cats.push(v);ch()}}
 else if(k=='delcat'){S.cats=S.cats.filter(x=>x!=a.dataset.v);scope='الكل';ch()}
 else if(k=='prc'){S.prices=a.checked;ch()}else if(k=='tk'){S.ticker.on=a.checked;ch()}else if(k=='pub')pub();
 else if(k=='cp'){try{await navigator.clipboard.writeText(a.dataset.v);toast('تم النسخ')}catch(_){toast('انسخه يدوياً')}}
 else if(k=='ns')addSheet();
 else if(k=='pk')dlg(`<div class="dh"><span>اختر منتجاً أو أكثر</span><button data-a="x">✕</button></div><div class="db">${S.products.map(q=>`<label class="pk"><input type="checkbox" value="${q.id}"><img src="${q.img}" alt="">${esc(q.name)}</label>`).join('')}<button class="go" data-a="pkok">إضافة للصفحات</button></div>`)
 else if(k=='pkok'){$('#dlg').querySelectorAll('input:checked').forEach(c=>addSheet(toSheet(S.products.find(q=>q.id==c.value))));$('#dlg').close()}
 else if(k=='xs')a.closest('.sheet').remove();else if(k=='af')a.previousElementSibling.insertAdjacentHTML('beforeend',li(''));else if(k=='ar')a.previousElementSibling.firstElementChild.insertAdjacentHTML('beforeend',tr('',''));
 else if(k=='sl'){tgt=a;$('#sfi').click()}
});
document.addEventListener('input',e=>{const p=e.target.dataset?.p;if(p){set(p,e.target.innerText.trim());rm()}if(e.target.id=='tt'){S.ticker.text=e.target.value;rm()}});
document.addEventListener('change',async e=>{const g=e.target;if(g.dataset.a=='sc'){scope=g.value;render()}
 else if(g.id=='fi'&&g.files[0])$('#pv').src=await shrink(g.files[0]);
 else if(g.id=='sfi'&&g.files[0]&&tgt){tgt.innerHTML=`<img src="${await shrink(g.files[0],1100)}" alt="">`;g.value=''}});
addEventListener('resize',fit);fit();render();
(async()=>{try{if(typeof claude=='undefined'){can=true;render();return}const u=await claude.use('user');art=await claude.use('artifact');if(art&&u&&u.canEdit()){can=true;render()}}catch(_){}})();
