<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>قوى الامتياز</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style id="qi-style">
@import url('https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap');

/* Layout: one-column chat. Sticky brand bar (logo, name, settings at the physical left), then a feed of message cards. Splash and sheets sit above it. */
:root{
  --bg:#f1efea;
  --surface:#ffffff;
  --surface-2:#f7f6f2;
  --ink:#173a35;
  --ink-2:#56736b;
  --line:#e3e1da;
  --forest:#1c3d38;
  --mint:#c6f0d6;
  --mint-soft:#e3f4ea;
  --mint-line:#cdeedb;
  --on-mint:#173a35;
  --danger:#b3382c;
  --shadow:0 1px 2px rgba(23,58,53,.05),0 10px 28px rgba(23,58,53,.07);
  --font:'Readex Pro','IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
  --r-card:28px; --r-tile:18px; --r-field:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1a18; --surface:#15262a; --surface-2:#1a2f2b; --ink:#e7f2ee; --ink-2:#93b0a7; --line:#27403a;
    --forest:#1e4b43; --mint-soft:#183029; --mint-line:#24463b; --danger:#ff9488;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1a18; --surface:#15262a; --surface-2:#1a2f2b; --ink:#e7f2ee; --ink-2:#93b0a7; --line:#27403a;
  --forest:#1e4b43; --mint-soft:#183029; --mint-line:#24463b; --danger:#ff9488;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,p{margin:0}
.ic{display:inline-flex;width:22px;height:22px;flex:none}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.on-dark :focus-visible{outline-color:var(--mint)}

#app{max-width:560px;margin-inline:auto;min-height:100vh;min-height:100dvh}

/* ---------- splash ---------- */
.splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;text-align:center;padding:24px;
  background:radial-gradient(120% 70% at 20% 0%,#3d6358 0%,#1c3d38 48%,#0f2b27 100%);color:#fff;
  transition:opacity .5s ease,visibility .5s}
.splash.out{opacity:0;visibility:hidden}
.splash .leaf{position:absolute;pointer-events:none;border-radius:60% 40% 60% 40%/50% 60% 40% 50%;background:rgba(255,255,255,.05)}
.splash .l1{width:420px;height:300px;right:-140px;top:-60px;transform:rotate(-24deg)}
.splash .l2{width:380px;height:260px;left:-150px;bottom:-40px;transform:rotate(18deg)}
.splash-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.splash-logo{width:128px;height:128px;border-radius:36px;background:#fff;display:grid;place-items:center;padding:14px;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.splash-logo img{width:100%;height:100%;object-fit:contain}
.splash .hi{margin-top:10px;color:var(--mint);font-size:18px;font-weight:400}
.splash .nm{font-size:clamp(26px,7vw,34px);font-weight:600;line-height:1.35;text-wrap:balance}
.splash-bar{position:absolute;bottom:calc(48px + env(safe-area-inset-bottom,0px));left:50%;width:120px;height:4px;margin-left:-60px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
.splash-bar i{display:block;height:100%;width:100%;background:var(--mint);transform-origin:right;animation:fill 3s linear both}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- header ---------- */
.shell{padding-bottom:64px;animation:fade .5s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo-tile{width:48px;height:48px;border-radius:16px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;padding:5px;flex:none;overflow:hidden}
.logo-tile img{width:100%;height:100%;object-fit:contain}
.logo-tile .ic{color:#9ab3aa}
.names{min-width:0}
.names .n{font-size:17px;font-weight:600;line-height:1.3;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.names .s{font-size:12px;color:var(--ink-2);direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gear{width:46px;height:46px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);flex:none;transition:transform .2s}
.gear:active{transform:scale(.94)}

/* ---------- feed ---------- */
.feed{display:flex;flex-direction:column;gap:14px;padding-top:10px}
.msg{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.msg-brand{display:flex;align-items:flex-end;gap:10px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--mint);border:1px solid var(--mint-line);display:grid;place-items:center;flex:none;overflow:hidden;padding:7px}
.avatar img{width:100%;height:100%;object-fit:contain}
.avatar .ic{color:var(--forest)}
.bubble{position:relative;overflow:hidden;color:#fff;border-radius:28px 28px 8px 28px;padding:20px 22px 22px;max-width:calc(100% - 54px);
  background:radial-gradient(90% 120% at 10% 0%,rgba(255,255,255,.16),transparent 55%),linear-gradient(165deg,#2b5348 0%,#1c3d38 58%,#143530 100%);box-shadow:var(--shadow)}
.pill{display:inline-block;direction:ltr;background:var(--mint);color:var(--on-mint);font-size:12px;font-weight:500;padding:3px 12px;border-radius:999px;margin-bottom:10px}
.bubble p{font-size:17px;line-height:1.75;font-weight:400;text-wrap:pretty;white-space:pre-line}
.typing{align-self:flex-start;display:flex;gap:5px;padding:14px 18px;border-radius:22px;background:var(--surface);border:1px solid var(--line);margin-inline-start:54px;width:max-content}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-2);opacity:.4;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:1;transform:translateY(-2px)}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.card-top{display:flex;gap:14px;align-items:flex-start}
.tile{width:52px;height:52px;border-radius:var(--r-tile);background:var(--forest);color:var(--mint);display:grid;place-items:center;flex:none}
.tile .ic{width:26px;height:26px}
.card-body{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.card-body h3{font-size:18px;font-weight:600;line-height:1.4;text-wrap:balance}
.line{font-size:14px;color:var(--ink-2);overflow-wrap:anywhere}
.line.ltr{direction:ltr;text-align:right;unicode-bidi:isolate}
.phones{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:4px}
.phones .lab{font-size:13px;color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;gap:8px;direction:ltr;padding:7px 14px 7px 12px;border-radius:999px;background:var(--mint-soft);border:1px solid var(--mint-line);font-size:15px;font-weight:500;letter-spacing:.02em;font-variant-numeric:tabular-nums;color:var(--ink);user-select:all}
.chip .ic{width:16px;height:16px;color:var(--ink-2)}
.chip:active{transform:scale(.97)}
.btn{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding:0 20px;border-radius:999px;background:var(--mint);color:var(--on-mint);font-weight:600;font-size:16px;text-decoration:none;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(.97)}
.btn:active{transform:scale(.985)}
.btn .ic{width:20px;height:20px}

/* ---------- toast + dirty pill ---------- */
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:90;background:var(--forest);color:#fff;padding:10px 20px;border-radius:999px;font-size:14px;transition:.3s;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.dirty{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 18px;border-radius:999px;background:var(--forest);color:#fff;box-shadow:var(--shadow);font-size:14px;white-space:nowrap}
.dirty button{background:var(--mint);color:var(--on-mint);border-radius:999px;padding:7px 18px;font-weight:600}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(10,28,25,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .2s ease both}
.pin-card{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:32px;padding:28px 24px 22px;display:flex;flex-direction:column;align-items:center;gap:16px;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
.pin-card h2{font-size:19px;font-weight:600}
.dots{display:flex;gap:14px;direction:ltr;height:20px;align-items:center}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink-2);transition:.15s}
.dots i.on{background:var(--forest);border-color:var(--forest);transform:scale(1.1)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.err{min-height:20px;font-size:13px;color:var(--danger)}
.keys{display:grid;grid-template-columns:repeat(3,68px);gap:12px;direction:ltr}
.key{width:68px;height:68px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);font-size:24px;font-weight:500;display:grid;place-items:center;font-variant-numeric:tabular-nums;transition:transform .12s,background .12s}
.key:active{transform:scale(.92);background:var(--mint-soft)}
.key.soft{background:none;border-color:transparent;color:var(--ink-2);font-size:14px}

.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;animation:rise .3s ease both}
.sheet-in{max-width:560px;margin-inline:auto;padding-inline:max(16px,env(safe-area-inset-left,0px));padding-bottom:150px}
.sheet-top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 0 14px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.sheet-top h2{font-size:22px;font-weight:600}
.icon-btn{width:44px;height:44px;border-radius:15px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);flex:none}
.icon-btn.sm{width:38px;height:38px;border-radius:13px}
.icon-btn.sm .ic{width:18px;height:18px}
.icon-btn:disabled{opacity:.35;cursor:default}
.icon-btn.warn{background:var(--danger);border-color:var(--danger);color:#fff;width:auto;padding:0 12px;font-size:13px;font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:20px;display:flex;flex-direction:column;gap:16px;margin-top:14px}
.panel h3{font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.panel h3 small{font-weight:400;color:var(--ink-2);font-size:13px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--ink-2)}
.input{width:100%;padding:12px 14px;border-radius:var(--r-field);background:var(--surface-2);border:1px solid var(--line);font-size:15px;line-height:1.5}
.input:focus{outline:2px solid var(--forest);outline-offset:0;background:var(--surface)}
textarea.input{resize:vertical;min-height:84px}
.input.ltr{direction:ltr;text-align:left}
.hint{font-size:12px;color:var(--ink-2)}
.logo-row{display:flex;align-items:center;gap:14px}
.logo-row .logo-tile{width:72px;height:72px;border-radius:22px;padding:8px}
.logo-actions{display:flex;flex-wrap:wrap;gap:8px}
.btn-s{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--ink)}
.btn-s.pri{background:var(--forest);border-color:var(--forest);color:#fff}
.btn-s .ic{width:18px;height:18px}
.btn-s input{display:none}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .tile{width:44px;height:44px;border-radius:15px}
.row .tile .ic{width:22px;height:22px}
.row .txt{flex:1;min-width:0}
.row .txt b{display:block;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .txt span{display:block;font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:right}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.add-btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:999px;border:1.5px dashed var(--ink-2);color:var(--ink);font-weight:600}
.add-btn:hover{background:var(--mint-soft)}
.sheet-foot{position:fixed;left:0;right:0;bottom:0;z-index:55;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.foot-in{max-width:560px;margin-inline:auto;display:flex;flex-direction:column;gap:8px}
.save{min-height:56px;border-radius:999px;background:var(--forest);color:#fff;font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:var(--shadow)}
.save:disabled{opacity:.55}
.status{text-align:center;font-size:13px;color:var(--ink-2);min-height:20px}
.status.bad{color:var(--danger)}

.editor{place-items:end center;padding:0;z-index:70}
.editor-card{width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;background:var(--bg);border-radius:32px 32px 0 0;padding:20px max(20px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;animation:slide .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes slide{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.editor-card h2{font-size:20px;font-weight:600}
.icon-pick{display:flex;flex-wrap:wrap;gap:8px}
.icon-pick button{width:48px;height:48px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.icon-pick button[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);color:var(--mint)}
.ed-actions{display:flex;gap:10px}
.ed-actions .btn-s{flex:1;justify-content:center;min-height:50px;font-size:15px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}
}
</style>

var PICK = ['pin','store','globe','instagram','tiktok','phone','chat','link'];
function ic(name,cls){
  var s = document.createElement('span');
  s.className = 'ic' + (cls ? ' ' + cls : '');
  s.setAttribute('aria-hidden','true');
  s.innerHTML = '<svg viewBox="0 0 24 24">' + (P[name] || P.link) + '</svg>';
  return s;
}
function h(tag, attrs, kids){
  var e = document.createElement(tag);
  if (attrs) for (var k in attrs){
    var v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'value') e.value = v;
    else if (k.slice(0,2) === 'on') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  (kids || []).forEach(function(c){
    if (c == null) return;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return e;
}
function fnv(s){
  var x = 2166136261;
  for (var i = 0; i < s.length; i++){ x ^= s.charCodeAt(i); x = Math.imul(x, 16777619) >>> 0; }
  return x >>> 0;
}
function safeUrl(u){
  u = (u || '').trim();
  if (!u) return '';
  if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u;
  try { var p = new URL(u); return (p.protocol === 'https:' || p.protocol === 'http:') ? p.href : ''; }
  catch(e){ return ''; }
}

/* ---------- feed ---------- */
function descLines(desc){
  var out = h('div', { class:'card-body-lines' });
  out.style.display = 'flex'; out.style.flexDirection = 'column'; out.style.gap = '4px';
  String(desc || '').split(/\r?\n/).forEach(function(raw){
    var line = raw.trim();
    if (!line) return;
    var nums = line.match(/05\d{8}/g);
    if (nums){
      var label = line.replace(/05\d{8}/g, '').replace(/[\s:：\-–·,،]+$/g, '').replace(/^[\s:：\-–·,،]+/g, '').trim();
      var row = h('div', { class:'phones' });
      if (label) row.appendChild(h('span', { class:'lab', text:label }));
      nums.forEach(function(n){
        row.appendChild(h('button', { class:'chip', type:'button', 'aria-label':'نسخ الرقم ' + n, onclick:function(ev){ copyText(n, ev.currentTarget); } }, [
          h('span', { text:n }), ic('copy')
        ]));
      });
      out.appendChild(row);
    } else {
      out.appendChild(h('p', { class:'line' + (/^[\x20-\x7E]+$/.test(line) ? ' ltr' : ''), text:line }));
    }
  });
  return out;
}
function card(t, i, animate){
  var url = safeUrl(t.url);
  var kids = [
    h('div', { class:'card-top' }, [
      h('div', { class:'tile' }, [ic(t.icon)]),
      h('div', { class:'card-body' }, [h('h3', { text:t.title || '' }), descLines(t.desc)])
    ])
  ];
  if (url) kids.push(h('a', { class:'btn', href:url, target:'_blank', rel:'noopener noreferrer' }, [
    h('span', { text:t.btn || 'فتح الرابط' }), ic('chev')
  ]));
  var c = h('article', { class:'card msg' }, kids);
  c.style.animationDelay = animate ? (i * 110) + 'ms' : '0ms';
  return c;
}
var feedTimer;
function renderFeed(animate){
  clearTimeout(feedTimer);
  feed.textContent = '';
  var av = h('div', { class:'avatar' }); fillLogo(av);
  var welcome = S.welcome || '';
  var bub = h('div', { class:'bubble' }, [
    S.sub ? h('span', { class:'pill', text:S.sub }) : null,
    welcome ? h('p', { text:welcome }) : null
  ]);
  if (welcome || S.sub) feed.appendChild(h('div', { class:'msg msg-brand' }, [av, bub]));
  function cards(){
    S.templates.forEach(function(t, i){ feed.appendChild(card(t, i, animate)); });
  }
  if (animate && S.templates.length){
    var dots = h('div', { class:'typing msg' }, [h('i'), h('i'), h('i')]);
    feed.appendChild(dots);
    feedTimer = setTimeout(function(){ if (dots.parentNode) feed.removeChild(dots); cards(); }, 750);
  } else cards();
}

function copyText(txt, el){
  var done = function(){ toast('تم نسخ الرقم'); };
  var fallback = function(){
    try {
      var r = document.createRange(); var node = el.querySelector('span') || el;
      r.selectNodeContents(node);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      toast('حدد الرقم وانسخه');
    } catch(e){}
  };
  try {
    navigator.clipboard.writeText(txt).then(done, fallback);
  } catch(e){ fallback(); }
}

/* ---------- PIN ---------- */
var pinEl = null, pinVal = '', fails = 0, lockUntil = 0;
function openPin(){
  if (pinEl) return;
  pinVal = '';
  var dots = h('div', { class:'dots', 'aria-hidden':'true' }, [h('i'), h('i'), h('i'), h('i')]);
  var err = h('p', { class:'err', role:'alert' });
  var keys = h('div', { class:'keys' });
  '123456789'.split('').forEach(function(d){ keys.appendChild(key(d)); });
  keys.appendChild(h('button', { class:'key soft', type:'button', onclick:closePin, text:'إلغاء' }));
  keys.appendChild(key('0'));
  keys.appendChild(h('button', { class:'key soft', type:'button', 'aria-label':'حذف', onclick:function(){ pinVal = pinVal.slice(0,-1); paint(); } }, [ic('backspace')]));
  function key(d){ return h('button', { class:'key', type:'button', onclick:function(){ press(d); }, text:d }); }
  function paint(){
    var ds = dots.children;
    for (var i = 0; i < 4; i++) ds[i].className = i < pinVal.length ? 'on' : '';
  }
  function press(d){
    if (Date.now() < lockUntil){ err.textContent = 'حاول مرة أخرى بعد قليل'; return; }
    if (pinVal.length >= 4) return;
    pinVal += d; err.textContent = ''; paint();
    if (pinVal.length === 4){
      if (fnv('qi|' + pinVal) === PIN_HASH){ var ok = true; closePin(); openSettings(); return; }
      fails++;
      dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake');
      err.textContent = 'الرمز غير صحيح';
      if (fails >= 5){ lockUntil = Date.now() + 30000; fails = 0; err.textContent = 'تم الإيقاف 30 ثانية'; }
      setTimeout(function(){ pinVal = ''; paint(); }, 380);
    }
  }
  pinEl = h('div', { class:'overlay', role:'dialog', 'aria-modal':'true', 'aria-label':'إدخال الرمز' }, [
    h('div', { class:'pin-card' }, [
      h('div', { class:'tile' }, [ic('lock')]),
      h('h2', { text:'أدخل الرمز' }),
      dots, err, keys
    ])
  ]);
  pinEl.addEventListener('click', function(e){ if (e.target === pinEl) closePin(); });
  pinEl._press = press; pinEl._back = function(){ pinVal = pinVal.slice(0,-1); paint(); };
  app.appendChild(pinEl);
}
function closePin(){ if (pinEl){ app.removeChild(pinEl); pinEl = null; } }
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){
    if (editorEl) closeEditor(); else if (pinEl) closePin(); else if (sheetEl) closeSettings();
    return;
  }
  if (!pinEl) return;
  if (/^[0-9]$/.test(e.key)) pinEl._press(e.key);
  else if (e.key === 'Backspace') pinEl._back();
});

function firstLine(t){

function renderList(){

    listEl.appendChild(h('p', { class:'hint', text:'لا توجد قوالب. أضف أول قالب من الزر أسفل.' }));
    return;
  }
  S.templates.forEach(function(t, i){
    var del = h('button', { class:'icon-btn sm', type:'button', 'aria-label':'حذف' }, [ic('trash')]);

    del.addEventListener('click', function(){
      if (!armed){
        armed = true; del.className = 'icon-btn sm warn'; del.textContent = 'تأكيد الحذف';
        timer = setTimeout(function(){ armed = false; del.className = 'icon-btn sm'; del.textContent = ''; del.appendChild(ic('trash')); }, 3000);

function move(i, d){

  var t = S.templates.splice(i, 1)[0];
  S.templates.splice(j, 0, t);
  markDirty(); renderList(); renderFeed(false);
}

    });

  ]);
  editorEl = h('div', { class:'overlay editor' }, [card_]);
  editorEl.addEventListener('click', function(e){ if (e.target === editorEl) closeEditor(); });
  app.appendChild(editorEl);
  setTimeout(function(){ title.focus(); }, 50);
}
function closeEditor(){ if (editorEl){ app.removeChild(editorEl); editorEl = null; } }

/* ---------- logo upload ---------- */
function pickLogo(file, box){
  if (!file) return;
  var fr = new FileReader();
  fr.onload = function(){
    var img = new Image();
    img.onload = function(){
      var max = 560, w = img.naturalWidth, hgt = img.naturalHeight, k = Math.min(1, max / Math.max(w, hgt));
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(hgt * k));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      var data = '';
      try { data = c.toDataURL('image/webp', 0.9); if (data.indexOf('image/webp') < 0) data = c.toDataURL('image/png'); } catch(e){}
      if (!data){ toast('تعذر قراءة الصورة'); return; }
      S.logo = data; fillLogo(box); updateBrand(); renderFeed(false); markDirty();
    };
    img.onerror = function(){ toast('الملف ليس صورة صالحة'); };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* ---------- publish ---------- */
function buildDoc(){
  var hs = document.head.querySelector('style');
  var reset = hs ? hs.textContent : FALLBACK_RESET;
  var css = document.getElementById('qi-style').textContent;
  var js = document.getElementById('qi-code').textContent;
  var json = JSON.stringify(S).replace(/</g, '\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>' +
    '<title>قوى الامتياز</title><meta name="claude:viewport-fit-sides" content="cover"><style id="qi-style">' + css + '</style>' +
    '<div id="app"></div><script type="application/json" id="state">' + json + '<\/script><script id="qi-code">' + js + '<\/script></body></html>';
}
var publishing = false;
function say(msg, bad){
  if (statusEl){ statusEl.textContent = msg; statusEl.className = 'status' + (bad ? ' bad' : ''); }
  else toast(msg);
}
function publish(){
  if (publishing) return;
  publishing = true;
  if (saveBtn) saveBtn.disabled = true;
  say('جارٍ النشر…');
  var api = window.claude && window.claude.use ? window.claude.use('artifact') : Promise.resolve(null);
  Promise.resolve(api).then(function(art){
    if (!art){ throw { code:'unavailable' }; }
    try { sessionStorage.setItem('qi-skip', '1'); } catch(e){}
    return art.publish(buildDoc());
  }).then(function(){
    dirty = false; say('تم النشر');
  }).catch(function(err){
    try { sessionStorage.removeItem('qi-skip'); } catch(e){}
    var code = err && err.code;
    var m = 'تعذر النشر. حاول مرة أخرى.';
    if (code === 'unavailable' || code === 'not_granted' || code === 'not_writer') m = 'النشر يحتاج فتح الصفحة من حساب صاحبها مع صلاحية التعديل.';
    else if (code === 'conflict') m = 'تم تعديل الصفحة من مكان آخر. ستُحمَّل النسخة الأحدث.';
    say(m, true);
  }).then(function(){
    publishing = false;
    if (saveBtn) saveBtn.disabled = false;
  });
}

build();
})();
</script>
