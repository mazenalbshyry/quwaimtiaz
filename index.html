else{const ks=Object.keys(f.days).sort().reverse();h=`<div class="dash" id="dash"></div><div class="sec nop"><div class="frm"><label>◉ <input data-of type="number" step="any" inputmode="decimal" value="${esc(f.open)}" style="padding:8px;border:1px solid var(--ln);border-radius:10px"></label><label><input type="checkbox" data-so ${f.showOpen?'checked':''}> 👁</label><input type="date" id="nd" value="${new Date().toISOString().slice(0,10)}"><button class="btn" data-a="newday">＋</button></div></div><div class="sec"><div class="tw"><table class="lst"><thead><tr><th>📅</th><th>مبيعات</th><th>مشتريات</th><th>مصروفات</th><th class="nop"></th></tr></thead><tbody>${ks.map(k=>{const c=calc(f.days[k]);return`<tr><td>${k}</td><td>${fm(sum(c.A.in))}</td><td>${fm(sum(c.A.pur))}</td><td>${fm(sum(c.A.exp))}</td><td class="nop"><button data-a="od" data-d="${k}">فتح</button> <button data-a="pd" data-d="${k}">🖨</button> <button data-a="dd" data-d="${k}">✕</button></td></tr>`}).join('')}</tbody></table></div></div>`}}
$('#bar').innerHTML=b;$('#app').innerHTML=h;upd()}

if(V.v=='month'&&V.t=='report'){const S=Dy(),C=calc(S);S.sections.forEach((s,i)=>{$('#pt'+i).textContent=s.k=='pend'?C.sec[i].n:fm(C.sec[i].t);C.sec[i].m.forEach((v,j)=>$(`#f${i}_${j}`).textContent=v?fm(v):'')});$('#dash').innerHTML=cards(C,bal(f,V.d))}

sv()}

document.addEventListener('input',e=>{const t=e.target,d=t.dataset,v=t.value;
