<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>قوى الإمتياز لتجارة مواد البناء</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{--navy:#003160;--navy-deep:#00264b;--gold:#ffb000;--gold-press:#e69f00;--bg:#f4f6f9;--fg:#0a2540;--muted:#4d6179;--card:#fff;--line:#d9e0ea;--wa:#1a8f4c;--brick:rgba(255,255,255,.07);--font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07182d;--fg:#eef3f9;--muted:#a8b8cc;--card:#0d2442;--line:#1d3556;--wa:#4cd98a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#07182d;--fg:#eef3f9;--muted:#a8b8cc;--card:#0d2442;--line:#1d3556;--wa:#4cd98a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 var(--font);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:22px;padding-block:20px 32px}
.band{background-color:var(--navy);background-image:linear-gradient(var(--brick) 1px,transparent 1px),linear-gradient(90deg,var(--brick) 1px,transparent 1px);background-size:48px 24px,96px 48px;border-radius:20px;padding:22px 20px;display:grid;place-items:center}
.plate{background:#fff;border-radius:14px;padding:14px;width:100%;display:grid;place-items:center}
.plate img{display:block;width:100%;max-width:280px;height:auto}
.ask{text-align:center}
h1{margin:0 0 6px;font-size:1.6rem;line-height:1.3;font-weight:700;text-wrap:balance}
.ask p{margin:0;color:var(--muted);text-wrap:balance}
.list{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.mine{border:2px solid var(--gold)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top h2{margin:0;font-size:1.15rem;font-weight:700}
.tag{font-size:.75rem;font-weight:600;background:var(--gold);color:var(--navy-deep);padding:2px 10px;border-radius:99px}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--gold);color:var(--navy-deep);font:700 1.1rem/1.2 var(--font);text-decoration:none;padding:16px;border-radius:14px;box-shadow:0 5px 0 var(--gold-press);transition:transform .12s,box-shadow .12s}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gold-press)}
.cta svg{width:22px;height:22px;fill:currentColor}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:1 1 0;min-width:96px;text-align:center;text-decoration:none;font:600 .9rem var(--font);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 8px}
.chip.wa{color:var(--wa);border-color:var(--wa)}
a:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.foot{margin:0;text-align:center;font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
.foot a{color:var(--muted)}
.credit{display:inline-block;margin-top:6px;font-size:.85rem;font-weight:600;color:var(--fg);text-decoration:underline;text-underline-offset:4px}
@media (prefers-reduced-motion:reduce){.cta{transition:none}}
</style></head><body>
