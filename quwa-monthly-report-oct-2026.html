 openMd("<h3>الأقسام والصفحات</h3><label>الأقسام (اضغط الاسم لتعديله)</label>"+S.secs.map(function(s){var n=S.rows.filter(function(r){return r.sec===s.id}).length;return'<div class="ar2"><input data-sn="'+s.id+'" value="'+E(s.name)+'"><select data-sr="'+s.id+'">'+op(s.role)+'</select><button class="b" data-sp="'+s.id+'">صفحة</button><button class="b" data-sd="'+s.id+'">حذف ('+n+")</button></div>"}).join("")+'<div class="ar2"><input id="nsn" placeholder="اسم قسم جديد"><select id="nsr">'+op("exp")+'</select><button class="b p" id="nsa">+ قسم</button></div><label>الصفحات</label>'+S.pages.map(function(p){return p.full?'<div class="ar2"><input data-pn="'+p.id+'" value="'+E(p.title)+'"><span class="hint">الصفحة الشاملة</span></div>':'<div class="ar2"><input data-pn="'+p.id+'" value="'+E(p.title)+'"><button class="b" data-pd="'+p.id+'">حذف</button></div>'+chips(p.secs,'data-pt="'+p.id+'" data-ps')}).join("")+'<div class="ar2"><button class="b p" data-np="1" style="flex:1">+ صفحة جديدة</button><button class="b" id="rst">استرجاع بيانات الملف الأصلي</button><button class="b" data-close="1">إغلاق</button></div>')}
function arm(b,fn,t){var k=b.dataset.k=b.dataset.k||Math.random();if(armed[k]){armed[k]=0;fn();return}armed[k]=1;var o=b.textContent;b.textContent=t||"تأكيد؟";setTimeout(function(){armed[k]=0;b.textContent=o},3000)}
function ch(){persist();render()}
document.addEventListener("change",function(e){var t=e.target,d=t.dataset;
 if(d.id){var r=S.rows.filter(function(x){return x.id===d.id})[0];if(!r)return;if(d.k==="d")r.d=Math.max(1,Math.min(31,parseInt(t.value)||r.d));else if(d.k==="amt")r.amt=N(t.value);else if(d.k==="pend")r.pend=t.value==="1";else r[d.k]=t.value;ch()}
 else if(d.nt){S.notes.filter(function(n){return n.id===d.nt})[0].t=t.value;persist()}
 else if(d.nd){S.notes.filter(function(n){return n.id===d.nd})[0].d=t.value;persist()}
 else if(d.sn){S.secs.filter(function(s){return s.id===d.sn})[0].name=t.value;persist();render()}
 else if(d.sr){S.secs.filter(function(s){return s.id===d.sr})[0].role=t.value;persist();render()}
 else if(d.pn){S.pages.filter(function(p){return p.id===d.pn})[0].title=t.value;persist();render()}
 else if(t.id==="npt")NP.t=t.value});
document.addEventListener("click",function(e){var t=e.target,d=t.dataset;
 if(d.pg){CUR=d.pg;render();window.scrollTo(0,0)}
 else if(d.np){NP={t:"",s:[]};npModal()}
 else if(d.close)closeMd();
 else if(d.nps){var i=NP.s.indexOf(d.nps);if(i>=0)NP.s.splice(i,1);else NP.s.push(d.nps);NP.t=$("npt").value;npModal()}
 else if(t.id==="npc"){var n=($("npt").value||"").trim();if(!n){toast("اكتب عنوان الصفحة");return}if(!NP.s.length){toast("اختر قسماً واحداً على الأقل");return}var p={id:nid("p"),title:n,secs:NP.s.slice()};S.pages.push(p);CUR=p.id;persist();closeMd();render()}
 else if(t.id==="bed"){EDIT=!EDIT;render()}
 else if(t.id==="bsv")save();
 else if(t.id==="bmg")mgr();
 else if(t.id==="bpr")window.print();
 else if(d.ar){var s=S.secs.filter(function(x){return x.id===d.ar})[0],last=S.rows.filter(function(r){return r.sec===s.id}).map(function(r){return r.d}).pop()||dlist().pop()||1;S.rows.push({id:nid("r"),sec:s.id,d:last,it:"",no:"",v:"",cl:"",nt:"",pay:s.role==="exp"||s.role==="boxin"||s.role==="boxout"?"cash":"cred",amt:0,pend:false});ch()}
 else if(d.dr)arm(t,function(){S.rows=S.rows.filter(function(r){return r.id!==d.dr});ch()},"؟");
 else if(d.an!==undefined){S.notes.push({id:nid("n"),d:"",sec:d.an,t:""});ch()}
 else if(d.dn){S.notes=S.notes.filter(function(n){return n.id!==d.dn});ch()}
 else if(t.id==="nsa"){var n=($("nsn").value||"").trim();if(!n){toast("اكتب اسم القسم");return}S.secs.push({id:nid("s"),name:n,role:$("nsr").value});persist();render();mgr()}
 else if(d.sp){var s=S.secs.filter(function(x){return x.id===d.sp})[0],p={id:nid("p"),title:s.name,secs:[s.id]};S.pages.push(p);CUR=p.id;persist();closeMd();render()}
 else if(d.sd)arm(t,function(){S.secs=S.secs.filter(function(s){return s.id!==d.sd});S.rows=S.rows.filter(function(r){return r.sec!==d.sd});S.pages.forEach(function(p){if(p.secs)p.secs=p.secs.filter(function(x){return x!==d.sd})});S.pages=S.pages.filter(function(p){return p.full||p.secs.length});persist();render();mgr()},"حذف نهائي؟");
 else if(d.pd){S.pages=S.pages.filter(function(p){return p.id!==d.pd});if(CUR===d.pd)CUR="all";persist();render();mgr()}
 else if(d.ps){var p=S.pages.filter(function(x){return x.id===d.pt})[0],i=p.secs.indexOf(d.ps);if(i>=0)p.secs.splice(i,1);else p.secs.push(d.ps);persist();render();mgr()}
 else if(t.id==="rst")arm(t,function(){S=clone(DATA);CUR="all";persist();closeMd();render()},"سيُمحى كل تعديلك؟")});
window.addEventListener("beforeprint",function(){if(EDIT){EDIT=false;window._re=1;render()}});window.addEventListener("afterprint",function(){if(window._re){window._re=0;EDIT=true;render()}});
render();initBE();
</script></body></html>
