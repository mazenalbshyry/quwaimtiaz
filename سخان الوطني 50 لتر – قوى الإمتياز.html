<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>سخان الوطني 50 لتر – قوى الإمتياز</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{--navy:#003160;--deep:#00264b;--gold:#ffb000;--gold2:#e69f00;--bg:#e6ebf2;--bar:#fff;--fg:#0a2540;--muted:#4d6179;--line:#d9e0ea;--tint:#f4f6f9;--brick:rgba(255,255,255,.07);--font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07182d;--bar:#0d2442;--fg:#eef3f9;--line:#1d3556;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#07182d;--bar:#0d2442;--fg:#eef3f9;--line:#1d3556;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font:15px/1.6 var(--font);color:var(--fg);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px;justify-content:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:10}
.bar button{font:600 .9rem var(--font);border:1px solid var(--line);background:transparent;color:var(--fg);padding:8px 14px;border-radius:10px;cursor:pointer}
.bar .go{background:var(--gold);color:var(--deep);border-color:var(--gold);box-shadow:0 3px 0 var(--gold2)}
.hint{width:100%;text-align:center;font-size:.8rem;color:var(--muted);margin:0}
#sheets{padding:18px 0 40px;display:flex;flex-direction:column;align-items:center;gap:18px;zoom:var(--z,1)}
.sheet{width:210mm;height:297mm;background:#fff;color:#0a2540;display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:0 6px 28px rgba(0,20,50,.25)}
.band{background-color:var(--navy);background-image:linear-gradient(var(--brick) 1px,transparent 1px),linear-gradient(90deg,var(--brick) 1px,transparent 1px);background-size:48px 24px,96px 48px;color:#fff;padding:20px 38px;display:flex;align-items:center;gap:22px;border-bottom:6px solid var(--gold)}
.plate{background:#fff;border-radius:14px;padding:8px 12px;flex:none}.plate img{display:block;height:62px;width:auto}
.band .t{flex:1}.band .t b{display:block;font-size:22px;line-height:1.3}.band .t span{opacity:.8;font-size:13px}
.main{flex:1;padding:20px 38px 14px;display:flex;flex-direction:column;gap:14px;min-height:0}
.kind{align-self:flex-start;background:var(--gold);color:var(--deep);font-weight:700;font-size:13px;padding:2px 14px;border-radius:99px}
h1{margin:0;font-size:38px;line-height:1.25;font-weight:700;color:var(--navy)}
.lead{margin:0;font-size:15px;color:#4d6179;max-width:62ch}
.slot{position:relative;border:3px solid var(--gold);border-radius:18px;background:var(--tint);display:grid;place-items:center;overflow:hidden;cursor:pointer;color:#4d6179;text-align:center;font-weight:600}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.slot:hover{border-color:var(--navy)}
.hero2{height:290px;flex:none;display:grid;grid-template-columns:1.25fr 1fr;gap:12px}.hero2 .slot{height:100%}.slot.cover img{object-fit:cover}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--navy);color:#fff;border-radius:12px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:22px;line-height:1.3;color:var(--gold)}.stat span{font-size:12px;opacity:.85}
.cols{display:grid;grid-template-columns:1fr 1.15fr;gap:20px;flex:1;min-height:0}
h2{margin:0 0 8px;font-size:17px;color:var(--navy);border-bottom:3px solid var(--gold);display:inline-block;padding-bottom:2px}
ul.f{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
ul.f li{display:flex;gap:8px;align-items:flex-start;position:relative}
ul.f li::before{content:"✓";flex:none;width:20px;height:20px;border-radius:50%;background:var(--gold);color:var(--deep);font-weight:700;font-size:12px;display:grid;place-items:center;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td{padding:5px 10px;border:1px solid var(--line);position:relative}
td:first-child{background:var(--navy);color:#fff;font-weight:600;width:38%}
tr:nth-child(even) td:last-child{background:var(--tint)}
.ft{background:var(--navy);color:#fff;border-top:6px solid var(--gold);padding:12px 38px;display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:14px}
.ft .n{font-size:12px;opacity:.8;display:block}.ft b{font-size:18px}.ft .ph{direction:ltr;font-weight:700;color:var(--gold);font-size:18px}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1;min-height:0;grid-auto-rows:1fr}
.cap{display:block;position:absolute;inset:auto 0 0;background:rgba(0,38,75,.85);color:#fff;font-size:13px;padding:3px 8px;z-index:2}
.x{position:absolute;top:4px;inset-inline-end:4px;z-index:3;border:0;background:#c0392b;color:#fff;width:22px;height:22px;border-radius:50%;font-size:14px;line-height:1;cursor:pointer;display:none}
li:hover>.x,tr:hover .x,.sheet:hover>.x{display:block}
li .x{top:2px}.add{align-self:flex-start;margin-top:8px;font:600 12px var(--font);border:1px dashed var(--navy);background:transparent;color:var(--navy);border-radius:8px;padding:4px 10px;cursor:pointer}
[contenteditable]:focus{outline:2px dashed var(--gold);outline-offset:2px}
.ph0{font-size:15px}
@media print{
@page{size:A4;margin:0}
html,body{background:#fff}body::before,.bar,.x,.add{display:none!important}
#sheets{padding:0;gap:0;zoom:1!important;display:block}
.sheet{box-shadow:none;break-after:page;page-break-after:always}
.slot{border-style:solid}.slot .ph0{display:none}
[contenteditable]:focus{outline:0}}
</style></head><body>
